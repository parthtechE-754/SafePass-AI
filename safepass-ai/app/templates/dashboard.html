<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePass AI — Admin Dashboard</title>
    <!-- MapLibre GL JS (Open-Source, Token-Free Engine) -->
    <link href="/static/css/maplibre-gl.css" rel="stylesheet">
    <script src="/static/js/maplibre-gl.js"></script>
    <script>
        window.mapboxgl = window.maplibregl;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="/static/css/main.css?v=3.8">
    <style>
        .dashboard-layout {
            display: flex;
            height: calc(100vh - var(--header-height));
        }
        .dashboard-sidebar {
            width: 360px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            overflow-y: auto;
            padding: 20px;
        }
        .dashboard-map { flex: 1; position: relative; }
        .dashboard-map #dash-map { width: 100%; height: 100%; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
        }
        .stat-card-value {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
        .blackspot-list { list-style: none; }
        .blackspot-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .blackspot-item:hover {
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }
        .blackspot-severity {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }
        .blackspot-info { flex: 1; min-width: 0; }
        .blackspot-name {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .blackspot-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="12" stroke="url(#grad2)" stroke-width="2.5" fill="none"/>
                        <path d="M14 6 L14 16 M14 16 L20 12" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="14" cy="14" r="3" fill="url(#grad2)"/>
                        <defs><linearGradient id="grad2" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#FF7A00"/><stop offset="1" stop-color="#EA580C"/></linearGradient></defs>
                    </svg>
                </div>
                <span class="logo-text">SafePass<span class="logo-highlight">AI</span></span>
            </div>
            <span class="header-tagline">Admin Dashboard — Corridor Risk Heatmap</span>
        </div>
        <div class="header-right">
            <div class="header-badge" id="live-status-badge" style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--bg-tertiary); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); font-size:0.8rem; color:var(--text-secondary); margin-right:8px;">
                <span class="live-pulse"></span>
                <span class="badge-text">Engine Online</span>
            </div>
            <a href="/" class="header-btn">← Back to App</a>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <h2 class="section-title"><span class="section-icon">📊</span> National Overview</h2>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-card-value" id="total-spots">--</div>
                    <div class="stat-card-label">Blackspots Tracked</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-value" id="total-states">--</div>
                    <div class="stat-card-label">States Covered</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-value" id="avg-severity">--</div>
                    <div class="stat-card-label">Avg Severity</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-value" id="total-fatalities">--</div>
                    <div class="stat-card-label">Annual Fatalities</div>
                </div>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px;">
                <h2 class="section-title" style="margin-bottom:0;"><span class="section-icon">⚠️</span> Blackspot Corridors</h2>
            </div>
            <input type="text" id="spot-filter" class="text-input" placeholder="Filter by city, state, highway..." style="margin-bottom:12px; font-size:0.8rem; padding:8px 12px;" oninput="filterBlackspots()">
            <ul class="blackspot-list" id="blackspot-list"></ul>
        </aside>

        <div class="dashboard-map">
            <div id="dash-map"></div>
        </div>
    </div>

    <script>
        const MAPBOX_TOKEN = "{{ mapbox_token }}";
        let allSpots = [];
        let globalGeojson = null;
        let dashMapInstance = null;

        function filterBlackspots() {
            const query = (document.getElementById('spot-filter').value || '').toLowerCase().trim();
            const filtered = allSpots.filter(s =>
                s.name.toLowerCase().includes(query) ||
                s.state.toLowerCase().includes(query) ||
                s.highway.toLowerCase().includes(query) ||
                s.description.toLowerCase().includes(query)
            );
            renderBlackspotList(filtered);
        }

        function renderBlackspotList(spots) {
            const listEl = document.getElementById('blackspot-list');
            listEl.innerHTML = '';
            spots.forEach(spot => {
                const color = spot.severity >= 8 ? '#DC2626' : spot.severity >= 6 ? '#F97316' : spot.severity >= 4 ? '#EAB308' : '#22C55E';
                const li = document.createElement('li');
                li.className = 'blackspot-item';
                li.innerHTML = `
                    <div class="blackspot-severity" style="background:${color}20;color:${color}">${spot.severity}</div>
                    <div class="blackspot-info">
                        <div class="blackspot-name">${spot.name}</div>
                        <div class="blackspot-meta">${spot.highway} · ${spot.state} · ${spot.annual_fatalities} fatalities/yr</div>
                    </div>
                `;
                li.onclick = () => {
                    if (globalGeojson && dashMapInstance) {
                        const feature = globalGeojson.features.find(f => f.properties.id === spot.id);
                        if (feature) {
                            dashMapInstance.flyTo({ center: feature.geometry.coordinates, zoom: 11, duration: 2000 });
                        }
                    }
                };
                listEl.appendChild(li);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Init map
            let dashMap;
            dashMap = new mapboxgl.Map({
                container: 'dash-map',
                style: {
                    version: 8,
                    sources: {
                        'esri-streets': {
                            type: 'raster',
                            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],
                            tileSize: 256,
                            attribution: 'Tiles &copy; Esri'
                        }
                    },
                    layers: [{ id: 'esri-streets', type: 'raster', source: 'esri-streets' }]
                },
                center: [79, 22], zoom: 5,
            });
            dashMapInstance = dashMap;

            dashMap.addControl(new mapboxgl.NavigationControl(), 'top-right');

            // Load blackspots
            const resp = await fetch('/api/blackspots');
            const geojson = await resp.json();

            const spots = geojson.features.map(f => f.properties);

            // Stats
            document.getElementById('total-spots').textContent = spots.length;
            document.getElementById('total-states').textContent = new Set(spots.map(s => s.state)).size;
            document.getElementById('avg-severity').textContent = (spots.reduce((a, s) => a + s.severity, 0) / spots.length).toFixed(1);
            document.getElementById('total-fatalities').textContent = spots.reduce((a, s) => a + s.annual_fatalities, 0);

            // List (sorted by severity)
            allSpots = [...spots].sort((a, b) => b.severity - a.severity);
            globalGeojson = geojson;
            renderBlackspotList(allSpots);

            // Add heatmap to dashboard map
            const addDashLayers = () => {
                if (!dashMap || !dashMap.isStyleLoaded()) return;
                if (!dashMap.getSource('dash-spots')) {
                    dashMap.addSource('dash-spots', { type: 'geojson', data: geojson });

                    dashMap.addLayer({
                        id: 'dash-heat',
                        type: 'heatmap',
                        source: 'dash-spots',
                        paint: {
                            'heatmap-weight': ['interpolate', ['linear'], ['get', 'severity'], 0, 0, 10, 1],
                            'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 0, 1, 10, 3],
                            'heatmap-color': [
                                'interpolate', ['linear'], ['heatmap-density'],
                                0, 'rgba(0,0,0,0)',
                                0.2, 'rgba(255,183,77,0.4)',
                                0.4, 'rgba(255,112,67,0.6)',
                                0.6, 'rgba(244,81,30,0.85)',
                                1, 'rgba(198,40,40,1)'
                            ],
                            'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 0, 15, 10, 40],
                            'heatmap-opacity': 0.85,
                        }
                    });

                    dashMap.addLayer({
                        id: 'dash-points',
                        type: 'circle',
                        source: 'dash-spots',
                        minzoom: 6,
                        paint: {
                            'circle-radius': ['interpolate', ['linear'], ['get', 'severity'], 5, 6, 10, 16],
                            'circle-color': ['interpolate', ['linear'], ['get', 'severity'], 0, '#16A34A', 4, '#D97706', 6, '#EA580C', 8, '#DC2626'],
                            'circle-opacity': 0.9,
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#FFFFFF',
                        }
                    });

                    dashMap.on('click', 'dash-points', (e) => {
                        const p = e.features[0].properties;
                        const color = p.severity >= 8 ? '#DC2626' : p.severity >= 6 ? '#EA580C' : p.severity >= 4 ? '#D97706' : '#16A34A';
                        new mapboxgl.Popup({ offset: 15 })
                            .setLngLat(e.lngLat)
                            .setHTML(`
                                <div style="font-weight:700;font-size:14px;color:#0F172A;margin-bottom:4px;">${p.name}</div>
                                <div style="display:inline-block;padding:2px 8px;border-radius:4px;background:${color}15;color:${color};font-weight:700;font-size:11px;margin-bottom:6px;">
                                    Severity: ${p.severity}/10
                                </div>
                                <div style="font-size:12px;color:#475569;line-height:1.4;">
                                    <strong>Highway:</strong> ${p.highway} (${p.state})<br>
                                    <strong>Fatalities/yr:</strong> ${p.annual_fatalities}<br>
                                    <em>${p.description || ''}</em>
                                </div>
                            `)
                            .addTo(dashMap);
                    });

                    dashMap.on('mouseenter', 'dash-points', () => { dashMap.getCanvas().style.cursor = 'pointer'; });
                    dashMap.on('mouseleave', 'dash-points', () => { dashMap.getCanvas().style.cursor = ''; });
                }
            };

            if (dashMap && (dashMap.isStyleLoaded() || dashMap.loaded())) {
                addDashLayers();
            } else if (dashMap) {
                dashMap.once('load', addDashLayers);
            }
        });
    </script>
</body>
</html>
